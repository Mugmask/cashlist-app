version: 2
updates:
  # One PR a month with every minor and patch. Majors are done by hand, when they're worth it.
  # Security fixes don't wait for this: Dependabot security updates open them right away,
  # majors included (the ignore below only applies to version updates)
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
